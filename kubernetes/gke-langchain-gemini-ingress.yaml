apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: langchain-gemini-ingress
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.allow-http: "true"
spec:
  rules:
  - host: api.hkiit-assistant.me  # 使用實際域名
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: langchain-gemini-service
            port:
              number: 8000