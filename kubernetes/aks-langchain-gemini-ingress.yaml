apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: langchain-gemini-ingress
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
  - host: api-azure.hkiit-assistant.me  # 使用實際域名
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: langchain-gemini-service
            port:
              number: 8000
              